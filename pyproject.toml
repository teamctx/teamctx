[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teamctx"
version = "0.0.0"
description = "Deterministic ambient context for software teams"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    { name = "teamctx contributors" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
keywords = [
    "context",
    "developer-tools",
    "github",
    "gitlab",
    "jira",
    "confluence",
]
dependencies = [
    "click>=8.1,<9.0",
    "pydantic>=2.7,<3.0",
]

[project.urls]
Homepage = "https://teamctx.dev"
Repository = "https://github.com/teamctx/teamctx"
Issues = "https://github.com/teamctx/teamctx/issues"

[project.scripts]
teamctx = "teamctx.cli:main"
teamctx-mcp = "teamctx.mcp_entry:main"
teamctx-hook = "teamctx.hook:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "mcp>=1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -v"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.coverage.run]
source = ["teamctx"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

